[book]
title = "The Zyl Programming Language"
description = "A deterministic Lisp systems language with region-based memory, capability types, actor concurrency, and native code generation"
authors = ["Zyl Team"]
language = "en"
src = "src"

[build]
build-dir = "../book-build"
create-missing = false

[output.html]
theme = "theme"
default-theme = "light"
preferred-dark-theme = "dark"
curly-quotes = true
mathjax-support = false
no-section-label = false
git-repository-url = "https://github.com/larrydewey/zyl"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/larrydewey/zyl/edit/main/book/src/{path}"
copy-fonts = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 10
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.print]
enable = true

[output.html.css]
additional = ["custom.css"]
