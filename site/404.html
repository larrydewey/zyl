<!doctype html>
<html lang="en">
<head>

<title>Zyl: page not found</title>

<style>
:root { color-scheme: dark; --ground: #0B1422; --text: #E4EFEE; --muted: #8EA7AE; --teal: #41E5B7; --err: #FF8A80; }
@media (prefers-color-scheme: light) { :root { color-scheme: light; --ground: #F2F7F6; --text: #0A2540; --muted: #4B6470; --teal: #00857B; --err: #B3261E; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ground); color: var(--text); font: 16px/1.6 ui-monospace, "JetBrains Mono", Menlo, monospace; padding-inline: 16px; }
main { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 640px; }
img { width: 120px; height: auto; }
.code { color: var(--err); font-weight: 700; }
p { margin: 6px 0; color: var(--muted); }
a { color: var(--teal); }
</style>
</head>
<body>
<main>
  <img src="/zyl/assets/parry.svg" alt="Parry the Owl">
  <div>

    <p><a href="/zyl/">Zyl home</a> · <a href="/zyl/book/">The book</a></p>
  </div>
</main>
